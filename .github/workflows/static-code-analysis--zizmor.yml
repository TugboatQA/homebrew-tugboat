name: Zizmor

# Called by static-code-analysis.yml as part of the "Static code analysis"
# required status check.

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    name: Run Zizmor Security Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Zizmor
        run: pip install zizmor==1.30.1

      - name: Run Zizmor
        run: zizmor .github
