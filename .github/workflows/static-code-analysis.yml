name: Static code analysis

# Every job in this workflow is part of the "Static code analysis" required
# status check. Each check lives in its own static-code-analysis--*.yml
# workflow, called here with workflow_call. Path filtering happens at the job
# level, not the trigger level, so the "Static code analysis" gate job reports a
# result on every pull request. To add a check, add a job that calls its
# workflow and list it in the "needs" of the gate job; branch protection does
# not need to change.

on:
  - pull_request

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      github: ${{ steps.filter.outputs.github }}
      formula: ${{ steps.filter.outputs.formula }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            github:
              - '.github/**'
            formula:
              - 'Formula/**'

  shellcheck:
    permissions:
      contents: read
    uses: $/.github/workflows/static-code-analysis--shellcheck.yml

  brew-style:
    permissions:
      contents: read
    uses: $/.github/workflows/static-code-analysis--brew-style.yml

  brew-audit:
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/static-code-analysis--brew-audit.yml

  zizmor:
    needs: changes
    if: needs.changes.outputs.github == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/static-code-analysis--zizmor.yml

  static-code-analysis:
    # The required status check for branch protection. It runs even when a job
    # it needs fails or is skipped, and fails if any of those jobs failed or was
    # cancelled. A skipped job counts as passing.
    name: Static code analysis
    if: always()
    needs: [changes, shellcheck, brew-style, brew-audit, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              exit 1
            fi
          done
