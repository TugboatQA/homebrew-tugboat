name: Integration

# Every job in this workflow is part of the "Integration" required status check.
# Each test lives in its own integration--*.yml workflow, called here with
# workflow_call. To add a test, add a job that calls its workflow and list it in
# the "needs" of the gate job; branch protection does not need to change.

on:
  - pull_request

permissions: {}

jobs:
  brew-install:
    permissions:
      contents: read
    uses: $/.github/workflows/integration--brew-install.yml

  integration:
    # The required status check for branch protection. It runs even when a job
    # it needs fails or is skipped, and fails if any of those jobs failed or was
    # cancelled. A skipped job counts as passing.
    name: Integration
    if: always()
    needs: [brew-install]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              exit 1
            fi
          done
