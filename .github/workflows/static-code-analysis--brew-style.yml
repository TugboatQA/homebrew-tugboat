name: Brew Style

# Called by static-code-analysis.yml as part of the "Static code analysis"
# required status check. Runs Homebrew's RuboCop config against the formulae.
# Styling the whole tap would also run actionlint, which rejects the $/
# reusable workflow syntax, and duplicate the shellcheck check.

on:
  workflow_call:

permissions: {}

jobs:
  brew-style:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # Taps this repository at the pull request commit, so no checkout step is
      # needed.
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9 # main

      - name: brew style
        env:
          TAP_PATH: ${{ steps.setup-homebrew.outputs.repository-path }}
        run: brew style "${TAP_PATH}/Formula"
