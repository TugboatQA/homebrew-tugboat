name: Brew Audit

# Called by static-code-analysis.yml as part of the "Static code analysis"
# required status check.

on:
  workflow_call:

permissions: {}

jobs:
  brew-audit:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # Taps this repository at the pull request commit, so no checkout step is
      # needed.
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9 # main

      - name: brew audit
        env:
          TAP_NAME: ${{ steps.setup-homebrew.outputs.tap-name }}
        run: brew audit --strict --online --tap "${TAP_NAME}"
