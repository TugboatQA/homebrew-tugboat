name: 'Run shellcheck on *.sh'

# Called by static-code-analysis.yml as part of the "Static code analysis"
# required status check.

on:
  workflow_call:

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@203a3fd018dfe73f8ae7e3aa8da2c149a5f41c33
        env:
          SHELLCHECK_OPTS: -x
        with:
          severity: warning
